name: Deploy frontend and extra to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site directory
        run: |
          mkdir -p _site/frontend
          mkdir -p _site/extra
          # Copia as pastas
          cp -r frontend/* _site/frontend/ 2>/dev/null || true
          cp -r extra/* _site/extra/ 2>/dev/null || true
          
          # Cria uma página inicial simples na raiz com links para os dois
          echo '<html><head><meta charset="utf-8"><title>BioGuard</title></head><body><h1>BioGuard - Menu</h1><ul><li><a href="./frontend/">Acessar Frontend</a></li><li><a href="./extra/">Acessar Extra</a></li></ul></body></html>' > _site/index.html
          
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4