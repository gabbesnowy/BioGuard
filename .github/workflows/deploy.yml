name: Deploy frontend and extra to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site directory
        run: |
          mkdir -p _site/frontend _site/extra
          cp -r frontend/. _site/frontend/
          cp -r extra/. _site/extra/
          cp -r imagens/.  _site/imagens/

          cat << 'EOF' > _site/index.html
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>BioGuard - Menu Principal</title>
              <style>
                  body { font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #0d1117; color: #c9d1d9; }
                  h1 { font-size: 2.5rem; margin-bottom: 2rem; }
                  .links { display: flex; gap: 2rem; flex-wrap: wrap; justify-content: center; }
                  a { text-decoration: none; color: white; background-color: #238636; padding: 1rem 2rem; border-radius: 8px; font-weight: bold; transition: background 0.3s; }
                  a:hover { background-color: #2ea043; }
              </style>
          </head>
          <body>
              <h1>BioGuard</h1>
              <div class="links">
                  <a href="./frontend/">Acessar Frontend</a>
                  <a href="./extra/">Acessar Extra</a>
              </div>
          </body>
          </html>
          EOF

          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
